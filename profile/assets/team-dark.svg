<text x="96" y="192" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#F2F4FA" text-anchor="start" letter-spacing="-0.02em">un mismo panal.</text>
<text x="96" y="232" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6AEC4" text-anchor="start">Cada celda es alguien del equipo.</text>
<text x="96" y="256" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6AEC4" text-anchor="start">Al final queda una libre: la tuya.</text></g><g class="pop"><use href="#hex" x="531" y="135.9948" width="112" height="129.33" fill="#10162A" stroke="#1C2440" stroke-width="2"/>
