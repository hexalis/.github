<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 210" width="1280" height="210" role="img" aria-labelledby="t d">
<title id="t">De una idea a tu celda</title>
<desc id="d">El recorrido de Hexalis en seis pasos: una idea, seis personas, el sistema, el ciclo, los proyectos y tu celda.</desc>
<style>
.rise{animation:rise .9s cubic-bezier(.23,1,.32,1) backwards}
.pop{animation:pop .7s cubic-bezier(.23,1,.32,1) backwards;transform-box:fill-box;transform-origin:center}
.fade{animation:fade 1.2s ease backwards}
.draw{stroke-dasharray:1;animation:draw 2.4s cubic-bezier(.77,0,.175,1) backwards}
.pulse{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 6s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.travel{offset-path:path('M102 68.4974 H1178');animation:travel 7s cubic-bezier(.77,0,.175,1) infinite}
@keyframes travel{0%{offset-distance:0%;opacity:0}8%{opacity:1}85%{offset-distance:100%;opacity:1}100%{offset-distance:100%;opacity:0}}</style>
<defs>
<symbol id="hex" viewBox="0 0 100 115.47"><path d="M57.8 4.5 L92.2 24.4 Q100 28.9 100 37.9 L100 77.6 Q100 86.6 92.2 91.1 L57.8 111 Q50 115.5 42.2 111 L7.8 91.1 Q0 86.6 0 77.6 L0 37.9 Q0 28.9 7.8 24.4 L42.2 4.5 Q50 0 57.8 4.5Z"/></symbol>
<symbol id="cube" viewBox="0 0 34 34"><path d="M17 2 30 9.5 17 17 4 9.5Z" fill="#7A9FEB"/><path d="M4 9.5 17 17v15L4 24.5Z" fill="#2E4383"/><path d="M30 9.5 17 17v15l13-7.5Z" fill="#4064C6"/></symbol>

</defs>
<path id="route" d="M102 68.4974 H1178" stroke="#D5D9E6" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" fill="none"/>
<circle r="7" fill="#4064C6" class="travel"/><g class="pop" style="animation-delay:0.00s"><use href="#hex" x="60" y="20" width="84" height="96.99" fill="#FFFFFF" stroke="#D5D9E6" stroke-width="2"/>
<text x="102" y="77.4974" font-family="'JetBrains Mono', ui-monospace, Consolas, 'SFMono-Regular', monospace" font-size="24" font-weight="800" fill="#0B1020" text-anchor="middle">01</text></g>
<g class="rise" style="animation-delay:0.20s"><text x="102" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0B1020" text-anchor="middle">Una idea</text></g>
<g class="pop" style="animation-delay:0.15s"><use href="#hex" x="275.2" y="20" width="84" height="96.99" fill="#FFFFFF" stroke="#D5D9E6" stroke-width="2"/>
<text x="317.2" y="77.4974" font-family="'JetBrains Mono', ui-monospace, Consolas, 'SFMono-Regular', monospace" font-size="24" font-weight="800" fill="#0B1020" text-anchor="middle">02</text></g>
<g class="rise" style="animation-delay:0.35s"><text x="317.2" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0B1020" text-anchor="middle">Seis personas</text></g>
<g class="pop" style="animation-delay:0.30s"><use href="#hex" x="490.4" y="20" width="84" height="96.99" fill="#FFFFFF" stroke="#D5D9E6" stroke-width="2"/>
<text x="532.4" y="77.4974" font-family="'JetBrains Mono', ui-monospace, Consolas, 'SFMono-Regular', monospace" font-size="24" font-weight="800" fill="#0B1020" text-anchor="middle">03</text></g>
<g class="rise" style="animation-delay:0.50s"><text x="532.4" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0B1020" text-anchor="middle">El sistema</text></g>
<g class="pop" style="animation-delay:0.45s"><use href="#hex" x="705.5999999999999" y="20" width="84" height="96.99" fill="#FFFFFF" stroke="#D5D9E6" stroke-width="2"/>
<text x="747.5999999999999" y="77.4974" font-family="'JetBrains Mono', ui-monospace, Consolas, 'SFMono-Regular', monospace" font-size="24" font-weight="800" fill="#0B1020" text-anchor="middle">04</text></g>
<g class="rise" style="animation-delay:0.65s"><text x="747.5999999999999" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0B1020" text-anchor="middle">El ciclo</text></g>
<g class="pop" style="animation-delay:0.60s"><use href="#hex" x="920.8" y="20" width="84" height="96.99" fill="#FFFFFF" stroke="#D5D9E6" stroke-width="2"/>
<text x="962.8" y="77.4974" font-family="'JetBrains Mono', ui-monospace, Consolas, 'SFMono-Regular', monospace" font-size="24" font-weight="800" fill="#0B1020" text-anchor="middle">05</text></g>
<g class="rise" style="animation-delay:0.80s"><text x="962.8" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0B1020" text-anchor="middle">Los proyectos</text></g>
<g class="pop" style="animation-delay:0.75s"><g class="pulse"><use href="#hex" x="1136" y="20" width="84" height="96.99" fill="#F3F4F8" stroke="#4064C6" stroke-width="3" stroke-dasharray="7 6"/></g>
<text x="1178" y="77.4974" font-family="'JetBrains Mono', ui-monospace, Consolas, 'SFMono-Regular', monospace" font-size="24" font-weight="800" fill="#4064C6" text-anchor="middle">06</text></g>
<g class="rise" style="animation-delay:0.95s"><text x="1178" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#4064C6" text-anchor="middle">Tu celda</text></g>
</svg>
